<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clear Screenshot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand" data-tauri-drag-region>Clear Screenshot</div>
    <nav>
      <button class="nav-item active" data-view="all">
        <span data-i18n="nav.all">모든 스크린샷</span><span class="count" id="count-all">–</span>
      </button>
      <button class="nav-item" data-view="similar">
        <span data-i18n="nav.similar">비슷한 스크린샷</span><span class="count" id="count-similar"></span>
      </button>
      <div class="nav-label" data-i18n="nav.auto">자동 분류</div>
      <div id="cats"></div>
      <div class="nav-label" data-i18n="nav.location">위치</div>
      <div id="sources"></div>
      <div class="nav-label" data-i18n="nav.apps">앱</div>
      <div id="apps"></div>
      <div class="nav-label" data-i18n="nav.devices">기기</div>
      <div id="devices"></div>
      <div class="nav-label" data-i18n="nav.months">월별</div>
      <div id="months"></div>
    </nav>
    <div class="sidebar-foot">
      <div class="foot-label" data-i18n="foot.folder">정리 폴더</div>
      <button class="link" id="dir" data-i18n-title="foot.open">–</button>
      <div class="foot-actions">
        <button class="btn ghost" id="refresh" data-i18n="btn.refresh">새로고침</button>
        <button class="btn ghost icon-only" id="open-settings" data-i18n-title="btn.settings" data-i18n-aria="set.title"><svg class="ic gear" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.59 2.68 L6.83 1.00 L9.17 1.00 L9.41 2.68 L10.76 3.24 L12.13 2.22 L13.78 3.87 L12.76 5.24 L13.32 6.59 L15.00 6.83 L15.00 9.17 L13.32 9.41 L12.76 10.76 L13.78 12.13 L12.13 13.78 L10.76 12.76 L9.41 13.32 L9.17 15.00 L6.83 15.00 L6.59 13.32 L5.24 12.76 L3.87 13.78 L2.22 12.13 L3.24 10.76 L2.68 9.41 L1.00 9.17 L1.00 6.83 L2.68 6.59 L3.24 5.24 L2.22 3.87 L3.87 2.22 L5.24 3.24 Z"/><circle cx="8" cy="8" r="2.3"/></svg></button>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar" id="topbar" data-tauri-drag-region>
    <header class="toolbar" data-tauri-drag-region>
      <div class="title-block">
        <h1 id="view-title" data-i18n="nav.all">모든 스크린샷</h1>
        <div class="sub" id="view-sub"></div>
      </div>
      <button class="qpill" id="qpill" hidden data-i18n-title="spot.clear"><span id="qpill-text"></span><span class="x">✕</span></button>
      <div class="actions">
        <button class="btn" id="review-start" data-i18n-title="tidy.tip"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/></svg><span class="lbl" data-i18n="tidy.button">빠른 정리</span></button>
        <button class="btn ghost" id="select-all" data-i18n-title="tb.selectAll.tip"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="m5.2 8.2 1.9 1.9 3.7-4"/></svg><span class="lbl" data-i18n="tb.selectAll">전체 선택</span></button>
        <button class="btn ghost" id="clear-sel" hidden data-i18n-title="tb.clear.tip"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg><span class="lbl" data-i18n="tb.clear">선택 해제</span></button>
        <button class="btn ghost" id="keep-sel" hidden data-i18n-title="tb.keep.tip"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5h7v11L8 11l-3.5 2.5z"/></svg><span class="lbl" data-i18n="tb.keep">보관</span></button>
        <button class="btn ghost" id="compare-sel" hidden data-i18n-title="tb.compare.tip"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="5" height="10" rx="1.2"/><rect x="9" y="3" width="5" height="10" rx="1.2"/></svg><span class="lbl" data-i18n="tb.compare">비교</span></button>
        <button class="btn" id="organize" data-i18n-title="org.tip"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg><span class="lbl">월별 폴더로 정리</span></button>
        <button class="btn danger" id="trash" disabled data-i18n-title="tb.trash.tip"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg><span class="lbl" data-i18n="tb.trash">휴지통으로</span></button>
      </div>
    </header>
    <div class="filterbar" id="filterbar" hidden></div>
    </div>
    <section id="content" class="content"></section>
    <footer class="statusbar" id="statusbar"><div class="sb-progress" id="sb-progress" hidden><div class="sb-fill" id="sb-fill"></div></div><span id="status" data-i18n="status.ready">준비 중…</span><span id="sb-pct" hidden></span><span id="selinfo"></span></footer>
  </main>

  <div class="overlay" id="preview" hidden>
    <div class="preview-box">
      <div class="preview-img"><img id="preview-img" alt="" /></div>
      <div class="preview-bar">
        <div class="preview-meta">
          <div class="preview-name" id="preview-name"></div>
          <div class="sub" id="preview-sub"></div>
          <div class="pv-cats" id="pv-cats"></div>
        </div>
        <div class="actions">
          <button class="btn ghost" id="pv-prev" data-i18n-title="pv.prev">←</button>
          <button class="btn ghost" id="pv-next" data-i18n-title="pv.next">→</button>
          <button class="btn ghost" id="pv-copy" data-i18n-title="pv.copy.tip" data-i18n="pv.copy">텍스트 복사</button>
          <button class="btn ghost" id="pv-reveal">Finder에서 보기</button>
          <button class="btn ghost" id="pv-open" data-i18n="pv.open">열기</button>
          <button class="btn danger" id="pv-trash" data-i18n="tb.trash">휴지통으로</button>
          <button class="btn ghost" id="pv-close" data-i18n-title="pv.close.tip" data-i18n="common.close">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="compare" hidden>
    <div class="compare-box">
      <div class="compare-head">
        <div class="title-block">
          <h2 id="cmp-title">비교</h2>
          <div class="sub" data-i18n="cmp.help"></div>
        </div>
        <div class="actions">
          <button class="btn ghost" id="cmp-zoom">실제 크기</button>
          <button class="btn danger" id="cmp-delete" disabled>삭제할 사진 표시</button>
          <button class="btn ghost" id="cmp-close" data-i18n="common.close">닫기</button>
        </div>
      </div>
      <div class="compare-grid" id="cmp-grid"></div>
    </div>
  </div>

  <div class="overlay analyze-overlay" id="analyzing" hidden>
    <div class="analyze-card">
      <div class="analyze-icon">✦</div>
      <h2 data-i18n="an.title">스크린샷 분석 중</h2>
      <p class="sub" data-i18n="an.body"></p>
      <div class="analyze-bar"><div class="analyze-fill" id="an-fill"></div></div>
      <div class="analyze-nums"><span id="an-count"></span><b id="an-pct">0%</b></div>
      <div class="sub" id="an-eta"></div>
      <button class="btn ghost" id="an-bg" data-i18n="an.background">백그라운드에서 계속</button>
    </div>
  </div>

  <div class="overlay spot-overlay" id="spot" hidden>
    <div class="spot" role="dialog">
      <div class="spot-input-row">
        <svg class="spot-ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="m10.5 10.5 3.4 3.4"/></svg>
        <input id="spot-input" type="text" data-i18n-ph="spot.ph" autocomplete="off" spellcheck="false" />
        <kbd>esc</kbd>
      </div>
      <div class="spot-results" id="spot-results"></div>
      <div class="spot-foot"><span id="spot-count"></span><span data-i18n="spot.hint"></span></div>
    </div>
  </div>

  <div class="overlay" id="settings" hidden>
    <div class="dialog settings">
      <div class="settings-head">
        <h2 data-i18n="set.title">설정</h2>
        <button class="btn" id="set-close" data-i18n="set.done">완료</button>
      </div>
      <div class="settings-body">
        <section>
          <h3 data-i18n="set.display">화면</h3>
          <div class="srow">
            <div class="grow" data-i18n="set.theme">테마</div>
            <div class="seg" data-key="theme"><button data-v="system" data-i18n="set.theme.system">시스템</button><button data-v="light" data-i18n="set.theme.light">라이트</button><button data-v="dark" data-i18n="set.theme.dark">다크</button></div>
          </div>
          <div class="srow">
            <div class="grow" data-i18n="set.lang">언어</div>
            <div class="seg" data-key="lang"><button data-v="auto" data-i18n="set.lang.auto">자동</button><button data-v="ko">한국어</button><button data-v="en">English</button><button data-v="ja">日本語</button><button data-v="es">Español</button></div>
          </div>
        </section>
        <section>
          <h3 data-i18n="set.folder">정리 폴더</h3>
          <div class="srow">
            <div class="grow"><div data-i18n="set.root">위치</div><div class="sub path" id="set-root"></div></div>
            <button class="btn ghost" id="set-root-pick" data-i18n="set.change">변경…</button>
            <button class="btn ghost" id="set-root-reset" data-i18n-title="set.reset.tip" data-i18n="set.reset">기본값</button>
          </div>
          <div class="srow">
            <div class="grow"><div data-i18n="set.layout">폴더 구조</div><div class="sub" id="set-layout-ex"></div></div>
            <div class="seg" data-key="layout"><button data-v="month">2026-05</button><button data-v="year_month">2026/05</button><button data-v="year">2026</button></div>
          </div>
          <div class="srow">
            <div class="grow"><div data-i18n="set.sc">macOS 스크린샷 저장 위치</div><div class="sub path" id="set-sc"></div></div>
            <button class="btn ghost" id="set-sc-apply" data-i18n="set.sc.apply">정리 폴더로 맞추기</button>
          </div>
        </section>
        <section>
          <h3 data-i18n="set.scope">찾는 범위</h3>
          <label class="srow">
            <div class="grow"><div data-i18n="set.wholeMac"></div><div class="sub" data-i18n="set.wholeMac.sub"></div></div>
            <input type="checkbox" class="switch" data-key="wholeMac" />
          </label>
          <label class="srow">
            <div class="grow"><div data-i18n="set.photos"></div><div class="sub" data-i18n="set.photos.sub"></div></div>
            <input type="checkbox" class="switch" data-key="photos" />
          </label>
          <div class="srow capture-row">
            <div class="grow">
              <div data-i18n="set.capture"></div>
              <div class="sub" data-i18n="set.capture.sub"></div>
              <div class="cap-list" id="set-capture-list"></div>
            </div>
            <button class="btn ghost" id="set-capture-add" data-i18n="set.capture.add"></button>
          </div>
        </section>
        <section>
          <h3 data-i18n="set.analysis">분석</h3>
          <label class="srow">
            <div class="grow"><div data-i18n="set.ocr"></div><div class="sub" data-i18n="set.ocr.sub"></div></div>
            <input type="checkbox" class="switch" data-key="ocr" />
          </label>
          <label class="srow">
            <div class="grow"><div data-i18n="set.ai"></div><div class="sub" id="set-ai-sub" data-i18n="set.ai.sub"></div></div>
            <input type="checkbox" class="switch" data-key="ai" id="set-ai-switch" />
          </label>
          <div class="srow">
            <div class="grow"><div data-i18n="set.similarity"></div><div class="sub" data-i18n="set.similarity.sub"></div></div>
            <div class="seg" data-key="similarity"><button data-v="strict" data-i18n="set.sim.strict">엄격</button><button data-v="normal" data-i18n="set.sim.normal">보통</button><button data-v="loose" data-i18n="set.sim.loose">느슨</button></div>
          </div>
        </section>
        <section>
          <h3 data-i18n="set.storage">저장공간</h3>
          <div class="srow">
            <div class="grow"><div data-i18n="set.cache.img">미리보기 캐시</div><div class="sub" id="set-cache-img">–</div></div>
            <button class="btn ghost" id="set-clear-img" data-i18n="set.clear">비우기</button>
          </div>
          <div class="srow">
            <div class="grow"><div data-i18n="set.cache.ocr">텍스트 인식 결과</div><div class="sub" id="set-cache-ocr">–</div></div>
            <button class="btn ghost" id="set-clear-ocr" data-i18n="set.clear">비우기</button>
          </div>
        </section>
        <p class="sub about" data-i18n="set.about"></p>
      </div>
    </div>
  </div>

  <div class="overlay" id="confirm" hidden>
    <div class="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="actions end">
        <button class="btn ghost" id="confirm-no" data-i18n="common.cancel">취소</button>
        <button class="btn" id="confirm-yes">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="i18n.js"></script>
  <script src="objects.js"></script>
  <script src="apps.js"></script>
  <script src="main.js"></script>
</body>
</html>
